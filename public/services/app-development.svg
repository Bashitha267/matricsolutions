
      <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0E1017" />
            <stop offset="50%" stop-color="#08090D" />
            <stop offset="100%" stop-color="#050508" />
          </linearGradient>
          <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E35C24" />
            <stop offset="100%" stop-color="#B83F10" />
          </linearGradient>
          <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E2333" />
            <stop offset="100%" stop-color="#121520" />
          </linearGradient>
          <radialGradient id="glowGrad" cx="50%" cy="48%" r="45%">
            <stop offset="0%" stop-color="#FF7738" stop-opacity="0.3" />
            <stop offset="60%" stop-color="#FF7738" stop-opacity="0.05" />
            <stop offset="100%" stop-color="transparent" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Base Background -->
        <rect width="800" height="1000" fill="url(#bgGrad)" />

        <!-- Grid Lines Pattern -->
        <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
          <line x1="80" y1="0" x2="80" y2="1000" />
          <line x1="240" y1="0" x2="240" y2="1000" />
          <line x1="400" y1="0" x2="400" y2="1000" />
          <line x1="560" y1="0" x2="560" y2="1000" />
          <line x1="720" y1="0" x2="720" y2="1000" />
          <line x1="0" y1="200" x2="800" y2="200" />
          <line x1="0" y1="400" x2="800" y2="400" />
          <line x1="0" y1="600" x2="800" y2="600" />
          <line x1="0" y1="800" x2="800" y2="800" />
        </g>

        <!-- Ambient Center Glow -->
        <circle cx="400" cy="480" r="350" fill="url(#glowGrad)" />

        <!-- Border Frame -->
        <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="#FF7738" stroke-width="2" stroke-opacity="0.35" />
        <rect x="40" y="40" width="720" height="920" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />

        <!-- Top Header Info -->
        <g transform="translate(60, 90)">
          <!-- Brand Tag -->
          <text x="0" y="0" fill="#94A3B8" font-family="'Raleway', sans-serif" font-size="14" font-weight="700" letter-spacing="3">MATRIX DIGITAL SOLUTION</text>
          <!-- Service Number -->
          <text x="680" y="5" fill="#FF7738" font-family="monospace" font-size="28" font-weight="900" text-anchor="end">04</text>
          <line x1="0" y1="25" x2="680" y2="25" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
        </g>

        <!-- Center 3D Symbol Illustration -->
        
      <!-- 3D Smartphone Device with floating UI -->
      <g transform="translate(400, 480)">
        <!-- Phone Body (Perspective) -->
        <rect x="-90" y="-150" width="180" height="300" rx="36" fill="#10131D" stroke="#E35C24" stroke-width="5" transform="rotate(-6)" />
        <!-- Screen Island -->
        <rect x="-35" y="-140" width="70" height="18" rx="9" fill="#000" transform="rotate(-6)" />
        <!-- Floating Glass Card -->
        <rect x="-70" y="-80" width="160" height="90" rx="16" fill="url(#coreGrad)" stroke="#FFF" stroke-width="2" transform="rotate(4)" opacity="0.9" />
        <circle cx="-35" cy="-35" r="16" fill="#FFF" />
        <rect x="-5" y="-45" width="70" height="8" rx="4" fill="#FFF" />
        <rect x="-5" y="-30" width="50" height="6" rx="3" fill="#FF884D" />
        <!-- Second Floating Pill -->
        <rect x="-60" y="40" width="140" height="60" rx="14" fill="#181D2B" stroke="#34D399" stroke-width="2" transform="rotate(-12)" />
        <circle cx="-30" cy="70" r="12" fill="#34D399" />
        <rect x="-10" y="66" width="60" height="7" rx="3" fill="#FFF" />
      </g>
    

        <!-- Bottom Service Name & Details Banner -->
        <g transform="translate(60, 750)">
          <!-- Category Pill -->
          <rect x="0" y="0" width="290" height="28" rx="14" fill="#FF7738" fill-opacity="0.15" stroke="#FF7738" stroke-opacity="0.4" stroke-width="1" />
          <text x="14" y="19" fill="#34D399" font-family="'Raleway', sans-serif" font-size="11" font-weight="800" letter-spacing="2">MOBILE IOS &amp;amp; ANDROID</text>

          <!-- PROMINENT SERVICE NAME -->
          <text x="0" y="70" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="36" font-weight="900" letter-spacing="1">
            APP DEVELOPMENT
          </text>

          <!-- Tagline -->
          <text x="0" y="105" fill="#CBD5E1" font-family="'Raleway', sans-serif" font-size="18" font-weight="500">
            Valuable pricing &amp;amp; high quality
          </text>

          <!-- Spec Tags Row -->
          <g transform="translate(0, 135)">
            
              <g transform="translate(0, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#FF7738" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">Native Performance</text>
              </g>
            
              <g transform="translate(165, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#FF7738" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">React Native &amp;amp; Flutter</text>
              </g>
            
              <g transform="translate(330, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#FF7738" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">Cloud API Integrations</text>
              </g>
            
              <g transform="translate(495, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#FF7738" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">App Store Publishing</text>
              </g>
            
          </g>
        </g>

        <!-- Subtle Watermark Seal -->
        <text x="740" y="940" fill="#94A3B8" font-family="monospace" font-size="11" opacity="0.4" text-anchor="end">MATRIX • AUS / LK</text>
      </svg>
    