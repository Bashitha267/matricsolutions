
      <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0E1017" />
            <stop offset="50%" stop-color="#08090D" />
            <stop offset="100%" stop-color="#050508" />
          </linearGradient>
          <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E35C24" />
            <stop offset="100%" stop-color="#B83F10" />
          </linearGradient>
          <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E2333" />
            <stop offset="100%" stop-color="#121520" />
          </linearGradient>
          <radialGradient id="glowGrad" cx="50%" cy="48%" r="45%">
            <stop offset="0%" stop-color="#E35C24" stop-opacity="0.3" />
            <stop offset="60%" stop-color="#E35C24" stop-opacity="0.05" />
            <stop offset="100%" stop-color="transparent" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Base Background -->
        <rect width="800" height="1000" fill="url(#bgGrad)" />

        <!-- Grid Lines Pattern -->
        <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
          <line x1="80" y1="0" x2="80" y2="1000" />
          <line x1="240" y1="0" x2="240" y2="1000" />
          <line x1="400" y1="0" x2="400" y2="1000" />
          <line x1="560" y1="0" x2="560" y2="1000" />
          <line x1="720" y1="0" x2="720" y2="1000" />
          <line x1="0" y1="200" x2="800" y2="200" />
          <line x1="0" y1="400" x2="800" y2="400" />
          <line x1="0" y1="600" x2="800" y2="600" />
          <line x1="0" y1="800" x2="800" y2="800" />
        </g>

        <!-- Ambient Center Glow -->
        <circle cx="400" cy="480" r="350" fill="url(#glowGrad)" />

        <!-- Border Frame -->
        <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="#E35C24" stroke-width="2" stroke-opacity="0.35" />
        <rect x="40" y="40" width="720" height="920" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />

        <!-- Top Header Info -->
        <g transform="translate(60, 90)">
          <!-- Brand Tag -->
          <text x="0" y="0" fill="#94A3B8" font-family="'Raleway', sans-serif" font-size="14" font-weight="700" letter-spacing="3">MATRIX DIGITAL SOLUTION</text>
          <!-- Service Number -->
          <text x="680" y="5" fill="#E35C24" font-family="monospace" font-size="28" font-weight="900" text-anchor="end">06</text>
          <line x1="0" y1="25" x2="680" y2="25" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
        </g>

        <!-- Center 3D Symbol Illustration -->
        
      <!-- 3D Cinema Film Reel & Waveform Timeline -->
      <g transform="translate(400, 480)">
        <!-- Film Reel Outer -->
        <circle cx="0" cy="-20" r="130" fill="#12131C" stroke="#E35C24" stroke-width="6" />
        <circle cx="0" cy="-20" r="100" fill="none" stroke="#FF884D" stroke-width="2" stroke-dasharray="12 12" />
        <!-- Center Spoke Holes -->
        <circle cx="0" cy="-20" r="40" fill="url(#coreGrad)" stroke="#FFF" stroke-width="3" />
        <circle cx="-60" cy="-20" r="18" fill="#0A0B10" stroke="#E35C24" stroke-width="2" />
        <circle cx="60" cy="-20" r="18" fill="#0A0B10" stroke="#E35C24" stroke-width="2" />
        <circle cx="0" cy="-80" r="18" fill="#0A0B10" stroke="#E35C24" stroke-width="2" />
        <circle cx="0" cy="40" r="18" fill="#0A0B10" stroke="#E35C24" stroke-width="2" />
        <!-- Floating 4K Badge -->
        <rect x="-55" y="90" width="110" height="42" rx="10" fill="#E35C24" stroke="#FFF" stroke-width="2" />
        <text x="0" y="119" fill="#000" font-family="'Montserrat', sans-serif" font-size="22" font-weight="900" text-anchor="middle">4K HDR</text>
        <!-- Audio waveform below -->
        <line x1="-120" y1="150" x2="-120" y2="170" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
        <line x1="-90" y1="140" x2="-90" y2="180" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
        <line x1="-60" y1="145" x2="-60" y2="175" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
        <line x1="60" y1="145" x2="60" y2="175" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
        <line x1="90" y1="140" x2="90" y2="180" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
        <line x1="120" y1="150" x2="120" y2="170" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
      </g>
    

        <!-- Bottom Service Name & Details Banner -->
        <g transform="translate(60, 750)">
          <!-- Category Pill -->
          <rect x="0" y="0" width="290" height="28" rx="14" fill="#E35C24" fill-opacity="0.15" stroke="#E35C24" stroke-opacity="0.4" stroke-width="1" />
          <text x="14" y="19" fill="#FBBF24" font-family="'Raleway', sans-serif" font-size="11" font-weight="800" letter-spacing="2">CINEMATIC &amp;amp; MOTION GRAPHICS</text>

          <!-- PROMINENT SERVICE NAME -->
          <text x="0" y="70" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="36" font-weight="900" letter-spacing="1">
            VIDEO EDITING
          </text>

          <!-- Tagline -->
          <text x="0" y="105" fill="#CBD5E1" font-family="'Raleway', sans-serif" font-size="18" font-weight="500">
            Tailored service with greatest experience
          </text>

          <!-- Spec Tags Row -->
          <g transform="translate(0, 135)">
            
              <g transform="translate(0, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#E35C24" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">4K Video Mastering</text>
              </g>
            
              <g transform="translate(165, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#E35C24" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">Color Grading (LUTs)</text>
              </g>
            
              <g transform="translate(330, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#E35C24" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">Motion Graphics &amp;amp; VFX</text>
              </g>
            
              <g transform="translate(495, 0)">
                <rect x="0" y="0" width="155" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
                <circle cx="12" cy="13" r="3" fill="#E35C24" />
                <text x="22" y="17" fill="#E2E8F0" font-family="'Raleway', sans-serif" font-size="10" font-weight="600">Social Media Reels</text>
              </g>
            
          </g>
        </g>

        <!-- Subtle Watermark Seal -->
        <text x="740" y="940" fill="#94A3B8" font-family="monospace" font-size="11" opacity="0.4" text-anchor="end">MATRIX • AUS / LK</text>
      </svg>
    